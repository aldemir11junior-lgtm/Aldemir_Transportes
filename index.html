<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aldemir Transportes</title>

<!-- PWA: permite "Adicionar à tela inicial" abrindo em tela cheia, com ícone próprio -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="icons/icon-192.png">
<!-- iPhone/Safari -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transportes">
<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     TELA DE LOGIN
     ══════════════════════════════════════════════════════════════ -->
<div id="tela-login">
  <div class="login-header">
    <div class="login-brand">Aldemir Transportes</div>
    <div class="login-brand-sub">Acesso restrito à equipe interna</div>
    <div class="login-brand-bar"></div>
  </div>
  <div class="login-box">
    <div id="msg-login" class="msg-area"></div>
    <label class="campo-label">Usuário</label>
    <input type="text" id="li-usuario" class="campo-input" autocomplete="username">
    <label class="campo-label">Senha</label>
    <input type="password" id="li-senha" class="campo-input" autocomplete="current-password">
    <button id="btn-entrar" class="btn btn-primary btn-block" style="margin-top:18px;">Entrar</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     MENU INICIAL (Gerencial / Operacional / Sair)
     ══════════════════════════════════════════════════════════════ -->
<div id="tela-menu" style="display:none"></div>

<!-- ══════════════════════════════════════════════════════════════
     SUBMENU (páginas da categoria escolhida)
     ══════════════════════════════════════════════════════════════ -->
<div id="tela-submenu" style="display:none"></div>

<!-- ══════════════════════════════════════════════════════════════
     APP (página selecionada)
     ══════════════════════════════════════════════════════════════ -->
<div id="app" style="display:none"></div>

<!-- Libs externas -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- App -->
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/auth.js"></script>
<script src="js/tab_dashboard.js"></script>
<script src="js/tab_viagens.js"></script>
<script src="js/tab_combustivel.js"></script>
<script src="js/tab_motoristas.js"></script>
<script src="js/tab_frota.js"></script>
<script src="js/tab_usuarios.js"></script>
<script src="js/tab_manutencao.js"></script>
<script src="js/main.js"></script>
</body>
</html>
